name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require a semantic version tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Run this workflow on a vMAJOR.MINOR.PATCH tag (optional prerelease suffix).'
            exit 1
          fi
  test-and-build:
    needs: validate-tag
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
  publish:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - name: Verify and publish the existing build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum --check checksums.txt)
          extra=()
          if [[ "$TAG" == *-* ]]; then extra+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG" "${extra[@]}"
          fi
